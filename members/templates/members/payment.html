<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription payment - HeartConnect Global</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-rose-50 h-screen flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white p-8 rounded-3xl shadow-2xl text-center">
        <div class="text-rose-500 text-6xl mb-4">💳</div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Pay your subscription</h2>
        <p class="text-gray-600 mb-6">Pay <strong>KES 130</strong> using M-Pesa STK Push. After payment, your profile will await confirmation by our team.</p>
        
        <div class="bg-rose-50 p-4 rounded-2xl mb-6 text-left border border-rose-100">
            <p class="text-sm font-bold text-rose-700 uppercase">Enter the M-Pesa number to charge:</p>
            <form method="post" class="mt-3 text-left">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="block w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-green-700">Send STK Push</button>
            </form>
        </div>
        {% for message in messages %}<p class="text-sm text-gray-700 my-3">{{ message }}</p>{% endfor %}
        
        <a href="/" class="block mt-4 text-sm text-gray-400 hover:underline text-center">Back to Home</a>
    </div>
</body>
</html>
